name: update-cli

on:
  repository_dispatch:
    types: [update-cli]
  workflow_dispatch:
    inputs:
      target_submodule:
        description: 'Submodule to update'
        required: true
        type: string
      target_version:
        description: 'Version to update to'
        required: true
        type: string

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    env:
      TARGET_SUBMODULE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target_submodule || inputs.target_submodule }}
      TARGET_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target_version || inputs.target_version }}
      BUNDLE_GITHUB__COM: ${{ secrets.BUNDLE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next

      - name: Check branch
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [ "$BRANCH" = "next" ]; then
            echo "Already on next branch"
          else
            echo "ERROR: Not on next branch, on $BRANCH"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "Bumpsnag Bot"
          git config --global user.email ""

      - name: Fetch full git history
        run: git fetch --depth=0

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev net-tools

      - name: Update submodule
        run: |
          echo "Updating $TARGET_SUBMODULE to version $TARGET_VERSION"
          bundle exec bumpsnag update-submodule "$TARGET_SUBMODULE" "$TARGET_VERSION"

      - name: Create pull request
        run: |
          VERSION_DISPLAY="${TARGET_VERSION#v}"
          gh pr create -B next \
            -H "bumpsnag-$TARGET_SUBMODULE-$TARGET_VERSION" \
            --title "Update $TARGET_SUBMODULE to version $VERSION_DISPLAY" \
            --body 'Created by bumpsnag' \
            --reviewer joshedney
