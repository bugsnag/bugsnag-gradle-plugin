name: update-cli

on:
  repository_dispatch:
    types: [update-cli]
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Version of the CLI to update to'
        required: true
        type: string

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    env:
      TARGET_SUBMODULE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target_submodule || inputs.target_submodule }}
      TARGET_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.target_version || inputs.target_version }}
      BUNDLE_GITHUB__COM: ${{ secrets.BUNDLE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next

      - name: Configure Git
        run: |
          git config --global user.name "Bumpsnag Bot"
          git config --global user.email ""

      - name: get git history
        run: git fetch --prune --unshallow

      - name: Install ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3

      - name: Install libcurl4-openssl-dev and net-tools
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev net-tools

      - name: Install dependencies
        run: bundle install

      - name: Remove leading 'v'
        shell: bash
        run: |
          echo "CLI_VERSION=${RAW_VERSION#v}" >> $GITHUB_ENV

      - run: |
          echo "Updating $TARGET_SUBMODULE to version $TARGET_VERSION" 
          bundle exec bumpsnag update-submodule $TARGET_SUBMODULE $TARGET_VERSION

      - name: List current branch name
        id: current-branch
        run: echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> $GITHUB_OUTPUT

      - name: Create pull request
        if: ${{ steps.current-branch.outputs.branch != 'next'}}
        run: >
          gh pr create -B next
          -H bumpsnag-$TARGET_SUBMODULE-$TARGET_VERSION
          --title "Update $TARGET_SUBMODULE to version $RAW_VERSION"
          --body 'Created by bumpsnag'
          --reviewer joshedney
